<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">FAQ assistant chat</title>
  <desc id="d">A chat window with a customer question, an assistant answer, and a message passing an unsure question to staff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1ec"/>
      <stop offset="1" stop-color="#ecdfe6"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a0a28" flood-opacity="0.18"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="190" fill="#820855" opacity="0.07"/>
  <circle cx="90" cy="640" r="150" fill="#820855" opacity="0.06"/>

  <!-- window -->
  <g filter="url(#sh)">
    <rect x="250" y="55" width="700" height="565" rx="26" fill="#fffdfb"/>
  </g>
  <path d="M250 81a26 26 0 0 1 26-26h648a26 26 0 0 1 26 26v59H250z" fill="#820855"/>
  <circle cx="300" cy="97" r="17" fill="#fffdfb" opacity="0.92"/>
  <text x="338" y="104" font-size="22" font-weight="600" fill="#fffdfb">FAQ assistant</text>
  <circle cx="900" cy="97" r="6" fill="#fffdfb" opacity="0.85"/>
  <circle cx="920" cy="97" r="6" fill="#fffdfb" opacity="0.55"/>

  <!-- customer bubble (right) -->
  <text x="910" y="182" font-size="15" fill="#5a4a53" text-anchor="end">Customer</text>
  <rect x="560" y="194" width="350" height="68" rx="22" fill="#820855"/>
  <text x="585" y="236" font-size="22" fill="#ffffff">Do you take bookings?</text>

  <!-- assistant bubble (left) -->
  <text x="290" y="306" font-size="15" fill="#5a4a53">Assistant</text>
  <rect x="290" y="318" width="480" height="108" rx="22" fill="#f1e6ec"/>
  <text x="315" y="358" font-size="21" fill="#2a1a24">Answered only from the</text>
  <text x="315" y="390" font-size="21" fill="#2a1a24">business's own FAQ.</text>

  <!-- customer bubble 2 -->
  <text x="910" y="466" font-size="15" fill="#5a4a53" text-anchor="end">Customer</text>
  <rect x="480" y="478" width="430" height="68" rx="22" fill="#820855"/>
  <text x="505" y="520" font-size="22" fill="#ffffff">A question the FAQ doesn't cover</text>

  <!-- passed to staff bubble -->
  <rect x="290" y="562" width="620" height="42" rx="21" fill="#fffdfb" stroke="#820855" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="314" y="589" font-size="17" font-weight="600" fill="#820855">Passed to staff: "I'm not sure, I'll pass this to the staff."</text>
</svg>
