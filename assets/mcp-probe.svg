<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">mcp-probe terminal</title>
  <desc id="d">A terminal window running npx @incultnitollc/mcp-probe test against a server, with a Tools section of PASS rows and a Schema Issues section with a WARN row.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1ec"/>
      <stop offset="1" stop-color="#ecdfe6"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a0a28" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 25px; }
  </style>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="60" r="180" fill="#820855" opacity="0.07"/>

  <g filter="url(#sh)">
    <rect x="130" y="70" width="940" height="535" rx="22" fill="#1f1620"/>
  </g>
  <path d="M130 92a22 22 0 0 1 22-22h896a22 22 0 0 1 22 22v36H130z" fill="#2e2230"/>
  <circle cx="170" cy="99" r="9" fill="#d98aba"/>
  <circle cx="200" cy="99" r="9" fill="#8b6f82"/>
  <circle cx="230" cy="99" r="9" fill="#8b6f82"/>
  <text x="600" y="108" font-size="18" fill="#bfa9b8" text-anchor="middle">terminal</text>

  <text x="170" y="190" fill="#f1e6ec"><tspan fill="#e08cc0">$</tspan> npx @incultnitollc/mcp-probe test &lt;server&gt;</text>

  <text x="170" y="258" fill="#bfa9b8">Tools:</text>
  <text x="170" y="308" fill="#f1e6ec"><tspan fill="#7be0a4" font-weight="700">PASS</tspan>  &lt;tool&gt; — &lt;description&gt;</text>
  <text x="170" y="358" fill="#f1e6ec"><tspan fill="#7be0a4" font-weight="700">PASS</tspan>  &lt;tool&gt; — &lt;description&gt;</text>
  <text x="170" y="418" fill="#bfa9b8">Schema Issues:</text>
  <text x="170" y="468" fill="#f1e6ec"><tspan fill="#f5c76a" font-weight="700">WARN</tspan>  &lt;tool&gt; — &lt;issue&gt;</text>

  <rect x="170" y="510" width="14" height="30" fill="#e08cc0"/>
</svg>
